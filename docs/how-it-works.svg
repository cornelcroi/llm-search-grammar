<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1120" width="1200" height="1120" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif">
<title>How one sentence becomes a query over the whole catalog: code spots the names, one LLM call reads the sentence against the grammar, code resolves the words and queries every film</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a9a397"/></marker></defs>
<rect width="1200" height="1120" fill="#0f141b"/>
<text x="60" y="62" font-size="13" fill="#e2a75a" font-weight="700" text-anchor="start" letter-spacing="1.4" xml:space="preserve">HOW ONE SENTENCE BECOMES A QUERY OVER THE WHOLE CATALOG</text>
<rect x="60" y="86" width="1080" height="70" rx="12" fill="#11171f" stroke="#93b1e6" stroke-width="1.6"/>
<text x="84" y="116" font-size="11" fill="#6f7680" font-weight="700" text-anchor="start" letter-spacing="1.2" xml:space="preserve">SOMEONE TYPES</text>
<text x="84" y="142" font-size="19" fill="#f3efe6" font-weight="400" text-anchor="start" font-family="Menlo, SF Mono, Consolas, monospace" xml:space="preserve">“a movie with the leading actors from titanic, directed by scorcese”</text>
<line x1="600" y1="162" x2="600" y2="182" stroke="#a9a397" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="60" y="186" width="1080" height="122" rx="12" fill="#161d26" stroke="#2c3440" />
<circle cx="100" cy="222" r="17" fill="#e2a75a"/>
<text x="100" y="228" font-size="16" fill="#0f141b" font-weight="800" text-anchor="middle" xml:space="preserve">1</text>
<text x="132" y="220" font-size="13" fill="#e2a75a" font-weight="700" text-anchor="start" letter-spacing="1.2" xml:space="preserve">CODE</text>
<text x="132" y="242" font-size="16" fill="#f3efe6" font-weight="600" text-anchor="start" xml:space="preserve">spots the films named</text>
<text x="520" y="222" font-size="15" fill="#f3efe6" font-weight="400" text-anchor="start" font-family="Menlo, SF Mono, Consolas, monospace" xml:space="preserve">titanic  →  Titanic (1997)</text>
<text x="520" y="246" font-size="15" fill="#f3efe6" font-weight="400" text-anchor="start" font-family="Menlo, SF Mono, Consolas, monospace" xml:space="preserve">also the 1953 and 1943 films: offered as “did you mean”</text>
<text x="132" y="290" font-size="13" fill="#6f7680" font-weight="400" text-anchor="start" xml:space="preserve">fuzzy match on titles, no embeddings</text>
<line x1="600" y1="310" x2="600" y2="330" stroke="#a9a397" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="60" y="334" width="1080" height="218" rx="12" fill="#161d26" stroke="#2c3440" />
<circle cx="100" cy="370" r="17" fill="#93b1e6"/>
<text x="100" y="376" font-size="16" fill="#0f141b" font-weight="800" text-anchor="middle" xml:space="preserve">2</text>
<text x="132" y="368" font-size="13" fill="#93b1e6" font-weight="700" text-anchor="start" letter-spacing="1.2" xml:space="preserve">ONE LLM CALL</text>
<text x="132" y="390" font-size="16" fill="#f3efe6" font-weight="600" text-anchor="start" xml:space="preserve">reads the sentence against the grammar</text>
<text x="520" y="370" font-size="15" fill="#f3efe6" font-weight="400" text-anchor="start" font-family="Menlo, SF Mono, Consolas, monospace" xml:space="preserve">{</text>
<text x="520" y="394" font-size="15" fill="#f3efe6" font-weight="400" text-anchor="start" font-family="Menlo, SF Mono, Consolas, monospace" xml:space="preserve">  &quot;directed_by&quot;: [&quot;Martin Scorsese&quot;],</text>
<text x="520" y="418" font-size="15" fill="#f3efe6" font-weight="400" text-anchor="start" font-family="Menlo, SF Mono, Consolas, monospace" xml:space="preserve">  &quot;references&quot;: [</text>
<text x="520" y="442" font-size="15" fill="#f3efe6" font-weight="400" text-anchor="start" font-family="Menlo, SF Mono, Consolas, monospace" xml:space="preserve">    { &quot;film&quot;: &quot;Titanic&quot;, &quot;wants&quot;: &quot;lead_actors&quot; }</text>
<text x="520" y="466" font-size="15" fill="#f3efe6" font-weight="400" text-anchor="start" font-family="Menlo, SF Mono, Consolas, monospace" xml:space="preserve">  ]</text>
<text x="520" y="490" font-size="15" fill="#f3efe6" font-weight="400" text-anchor="start" font-family="Menlo, SF Mono, Consolas, monospace" xml:space="preserve">}</text>
<text x="132" y="534" font-size="13" fill="#6f7680" font-weight="400" text-anchor="start" xml:space="preserve">the model&#x27;s real JSON (empty fields left out). It saw the grammar, never the rows</text>
<line x1="600" y1="554" x2="600" y2="574" stroke="#a9a397" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="60" y="578" width="1080" height="218" rx="12" fill="#161d26" stroke="#2c3440" />
<circle cx="100" cy="614" r="17" fill="#e2a75a"/>
<text x="100" y="620" font-size="16" fill="#0f141b" font-weight="800" text-anchor="middle" xml:space="preserve">3</text>
<text x="132" y="612" font-size="13" fill="#e2a75a" font-weight="700" text-anchor="start" letter-spacing="1.2" xml:space="preserve">CODE</text>
<text x="132" y="634" font-size="16" fill="#f3efe6" font-weight="600" text-anchor="start" xml:space="preserve">the resolver: words into catalog values</text>
<text x="520" y="614" font-size="15" fill="#f3efe6" font-weight="400" text-anchor="start" font-family="Menlo, SF Mono, Consolas, monospace" xml:space="preserve">{</text>
<text x="520" y="638" font-size="15" fill="#f3efe6" font-weight="400" text-anchor="start" font-family="Menlo, SF Mono, Consolas, monospace" xml:space="preserve">  &quot;director&quot;: [&quot;Martin Scorsese&quot;],</text>
<text x="520" y="662" font-size="15" fill="#f3efe6" font-weight="400" text-anchor="start" font-family="Menlo, SF Mono, Consolas, monospace" xml:space="preserve">  &quot;cast&quot;: [&quot;Leonardo DiCaprio&quot;, &quot;Kate Winslet&quot;],</text>
<text x="520" y="686" font-size="15" fill="#f3efe6" font-weight="400" text-anchor="start" font-family="Menlo, SF Mono, Consolas, monospace" xml:space="preserve">  &quot;cast_mode&quot;: &quot;any&quot;,</text>
<text x="520" y="710" font-size="15" fill="#f3efe6" font-weight="400" text-anchor="start" font-family="Menlo, SF Mono, Consolas, monospace" xml:space="preserve">  &quot;exclude&quot;: [&quot;Q44578&quot;]</text>
<text x="520" y="734" font-size="15" fill="#f3efe6" font-weight="400" text-anchor="start" font-family="Menlo, SF Mono, Consolas, monospace" xml:space="preserve">}</text>
<text x="132" y="778" font-size="13" fill="#6f7680" font-weight="400" text-anchor="start" xml:space="preserve">lead actors = the first two names of Titanic’s cast. Q44578 is Titanic (1997), not a result of itself</text>
<line x1="600" y1="798" x2="600" y2="818" stroke="#a9a397" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="60" y="822" width="1080" height="146" rx="12" fill="#161d26" stroke="#2c3440" />
<circle cx="100" cy="858" r="17" fill="#e2a75a"/>
<text x="100" y="864" font-size="16" fill="#0f141b" font-weight="800" text-anchor="middle" xml:space="preserve">4</text>
<text x="132" y="856" font-size="13" fill="#e2a75a" font-weight="700" text-anchor="start" letter-spacing="1.2" xml:space="preserve">CODE</text>
<text x="132" y="878" font-size="16" fill="#f3efe6" font-weight="600" text-anchor="start" xml:space="preserve">queries every film</text>
<text x="520" y="858" font-size="15" fill="#f3efe6" font-weight="400" text-anchor="start" font-family="Menlo, SF Mono, Consolas, monospace" xml:space="preserve">WHERE director = &#x27;Martin Scorsese&#x27;</text>
<text x="520" y="882" font-size="15" fill="#f3efe6" font-weight="400" text-anchor="start" font-family="Menlo, SF Mono, Consolas, monospace" xml:space="preserve">  AND cast INCLUDES ANY (&#x27;Leonardo DiCaprio&#x27;, &#x27;Kate Winslet&#x27;)</text>
<text x="520" y="906" font-size="15" fill="#f3efe6" font-weight="400" text-anchor="start" font-family="Menlo, SF Mono, Consolas, monospace" xml:space="preserve">  AND film &lt;&gt; &#x27;Q44578&#x27;</text>
<text x="132" y="950" font-size="13" fill="#6f7680" font-weight="400" text-anchor="start" xml:space="preserve">plain Python in this repo; with a database, the same filters become SQL</text>
<line x1="600" y1="970" x2="600" y2="990" stroke="#a9a397" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="60" y="994" width="1080" height="64" rx="12" fill="#1b2a26" stroke="#7fc4b4" stroke-width="1.4"/>
<text x="84" y="1034" font-size="18" fill="#7fc4b4" font-weight="600" text-anchor="start" xml:space="preserve">The Departed (2006)  ·  The Wolf of Wall Street (2013)  ·  Shutter Island (2010)</text>
<text x="600" y="1086" font-size="17" fill="#f3efe6" font-weight="600" text-anchor="middle" xml:space="preserve">No RAG. No embeddings. No vector database. The model never sees a row of the catalog.</text>
</svg>
